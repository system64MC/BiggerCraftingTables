buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath ('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') {
            changing = true
        }
    }
}

apply plugin: 'forge'

version = "1.7.10-1.7"
group= "wanion.biggercraftingtables" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "BiggerCraftingTables"

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
}

sourceCompatibility = 1.8
targetCompatibility = 1.8

dependencies {
    // compile files('libs/CodeChickenCore-1.7.10-1.0.7.47-dev.jar')
    // compile files('libs/CodeChickenLib-1.7.10-1.1.3.138-dev.jar')
    // compile files('libs/NotEnoughItems-1.7.10-1.0.5.120-dev.jar')
    // compile files('libs/MineTweaker3-1.7.10-3.0.10B.jar')
    compile files('libs/WanionLib-1.7.10-1.7-dev.jar')

    compile files('libs2/CodeChickenCore-1.4.22-dev.jar')
    compile files('libs2/CodeChickenLib-1.3.0-dev.jar')
    compile files('libs2/NotEnoughItems-2.8.151-GTNH-dev.jar')
    // compile files('libs2/+unimixins-all-1.7.10-0.3.2-dev.jar')
    // compile files('libs2/gtnhlib-0.11.51-dev.jar')
    compile files('libs2/CraftTweaker-1.7.10.3.1.0-legacy.jar')
}

processResources
{
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
                
        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
        
    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
